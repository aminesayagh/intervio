# Runs every check, the same as `make check`, on main: on each push to main and on each
# pull request into main (so a feature branch is tested before it is merged).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # On a pull request, which side changed: a job whose side did not change is skipped,
  # and a job skipped by its `if` still counts as passed for main's required checks.
  # On a push to main both jobs always run.
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: dorny/paths-filter@v4.0.3
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            workflow: &workflow
              - '.github/workflows/**'
            backend:
              - *workflow
              - 'backend/**'
            frontend:
              - *workflow
              - 'frontend/**'

  backend:
    name: Backend (build and tests)
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      # Unit tests, then *IT integration tests against PostgreSQL (Testcontainers uses the runner's Docker).
      - run: ./mvnw -B verify

  frontend:
    name: Frontend (lint, types, unused code, format, tests, build)
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm unused
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build
