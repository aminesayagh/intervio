spring.application.name=intervio

# Local defaults match compose.yaml; set DB_URL, DB_USERNAME and DB_PASSWORD in other environments.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/intervio}
spring.datasource.username=${DB_USERNAME:intervio}
spring.datasource.password=${DB_PASSWORD:intervio}

# Flyway owns the schema; Hibernate only checks it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Email (local: Mailpit from compose.yaml, web inbox on http://localhost:8025)
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

# Auth. REMEMBER_ME_KEY must be a long random secret outside local development.
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.remember-me-key=${REMEMBER_ME_KEY:local-development-only-remember-me-key}
app.mail-from=${MAIL_FROM:no-reply@intervio.local}

# Google sign-in is enabled when these two are set (from Google Cloud console):
#   SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID
#   SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR

# Uploads: documents up to 10 MB, logos up to 2 MB (each purpose checks its own limit).
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# Uploaded files are kept on disk in storage/ at the repository root (git-ignored), and every upload
# is scanned by ClamAV (compose.yaml). FILES_ROOT, CLAMAV_HOST and CLAMAV_PORT change them.
app.files.root=${FILES_ROOT:../storage}
app.files.virus-scan=true
app.files.clamav-host=${CLAMAV_HOST:localhost}
app.files.clamav-port=${CLAMAV_PORT:3310}

# The description's AI (decision 153), through Spring AI. Set OPENAI_API_KEY to turn it on (never
# commit it); without it the endpoint answers ERROR_AI_UNAVAILABLE. OPENAI_MODEL changes the model.
app.ai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.api-key=${OPENAI_API_KEY:not-set}
spring.ai.openai.chat.options.model=${OPENAI_MODEL:gpt-4.1-mini}
spring.ai.openai.chat.options.max-completion-tokens=2000
spring.ai.openai.chat.options.stream-options.include-usage=true
