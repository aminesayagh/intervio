# Local services for development. Credentials are local-only defaults.
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: intervio
      POSTGRES_USER: intervio
      POSTGRES_PASSWORD: intervio
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
  # Catches outgoing emails locally; read them on http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"
  # Virus scanner for uploads (port 3310). First start downloads the signatures (a few minutes).
  clamav:
    image: clamav/clamav:stable
    ports:
      - "3310:3310"
    volumes:
      - clamav-data:/var/lib/clamav
volumes:
  postgres-data:
  clamav-data:
