<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>{{subject}}</title>
</head>
<body style="margin:0;padding:0;background:#f2f1ec;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#f2f1ec;">
<tr><td align="center" style="padding:32px 16px;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:480px;font-family:Manrope,Arial,Helvetica,sans-serif;color:#252522;">
<tr><td style="padding:0 0 20px 0;">
<table role="presentation" cellpadding="0" cellspacing="0" border="0"><tr>
<td style="vertical-align:middle;padding-right:8px;"><img src="cid:logo" width="28" height="28" alt="" style="display:block;border:0;"></td>
<td style="vertical-align:middle;font-size:18px;color:#252522;">Intervio</td>
</tr></table>
</td></tr>
<tr><td style="background:#fcfbf8;border:1px solid #deddd5;border-radius:6px;padding:28px;">
<p style="margin:0 0 12px 0;font-size:15px;line-height:22px;">{{greeting}}</p>
<p style="margin:0 0 24px 0;font-size:15px;line-height:22px;">{{intro}}</p>
<table role="presentation" cellpadding="0" cellspacing="0" border="0"><tr>
<td style="background:#f4c542;border-radius:6px;">
<a href="{{url}}" style="display:inline-block;padding:11px 22px;font-size:14px;font-weight:600;color:#252522;text-decoration:none;">{{button}}</a>
</td></tr></table>
<p style="margin:24px 0 0 0;font-size:13px;line-height:20px;color:#686862;">{{note}}</p>
</td></tr>
<tr><td style="padding:16px 4px 0 4px;font-size:12px;line-height:18px;color:#686862;">{{footer}}</td></tr>
</table>
</td></tr>
</table>
</body>
</html>
