spring.application.name=intervio

# Local defaults match compose.yaml; set DB_URL, DB_USERNAME and DB_PASSWORD in other environments.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/intervio}
spring.datasource.username=${DB_USERNAME:intervio}
spring.datasource.password=${DB_PASSWORD:intervio}

# Flyway owns the schema; Hibernate only checks it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Email (local: Mailpit from compose.yaml, web inbox on http://localhost:8025)
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

# Auth. REMEMBER_ME_KEY must be a long random secret outside local development.
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.remember-me-key=${REMEMBER_ME_KEY:local-development-only-remember-me-key}
app.mail-from=${MAIL_FROM:no-reply@intervio.local}

# Google sign-in is enabled when these two are set (from Google Cloud console):
#   SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID
#   SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR

# Uploads: company logos are at most 2 MB (decision 63).
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB
